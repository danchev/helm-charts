# See https://github.com/helm/chart-testing#configuration
remote: origin
target-branch: master
chart-dirs:
  - charts
chart-repos:
  - danchev=https://danchev.github.io/helm-charts
  - minio-operator=https://operator.min.io
helm-extra-args: "--timeout 600s"
validate-chart-schema: true
validate-chart-values: true
# Charts retain upstream authors' display names rather than GitHub account names.
validate-maintainers: false
validate-yaml: true
exclude-deprecated: true
excluded-charts: []
additional-commands:
  - helm unittest --strict --file 'tests/*_test.yaml' {{ .Path }}
