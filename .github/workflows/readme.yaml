name: Sync documentation

on:
  workflow_call:

jobs:
  sync-docs:
    permissions:
      contents: write

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Save documentation
        run: |
          find README.md charts -type f -name '*.md' -print0 \
            | tar --null -T - -cf "$RUNNER_TEMP/docs.tar"

      - name: Check out GitHub Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages

      - name: Publish documentation
        run: |
          find charts -type f -name '*.md' -delete
          tar -xf "$RUNNER_TEMP/docs.tar"
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
          git add README.md charts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit --signoff -m "docs: sync chart documentation from master"
          git push
