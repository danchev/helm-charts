name: Release Charts

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  validation:
    permissions:
      contents: read
    uses: ./.github/workflows/lint-test.yaml

  release:
    needs: validation
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.2

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reuse published archives so retries preserve their original bytes.
      - name: Prepare chart packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .cr-release-packages
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/releases.txt"
          for chart in charts/*; do
            name=$(helm show chart "$chart" | awk '/^name:/ {print $2}')
            version=$(helm show chart "$chart" | awk '/^version:/ {print $2}')
            tag="$name-$version"
            if grep -Fxq "$tag" "$RUNNER_TEMP/releases.txt"; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$tag.tgz" --clobber --dir .cr-release-packages
            else
              cr package "$chart" --config .github/ci/cr.yaml
            fi
          done

      - name: Publish chart releases and index
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cr upload --config .github/ci/cr.yaml --skip-existing --commit "$(git rev-parse HEAD)"
          cr index --config .github/ci/cr.yaml --push

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in .cr-release-packages/*.tgz; do
            helm push "${pkg}" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"
          done

  documentation:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/readme.yaml
