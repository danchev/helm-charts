# [Core]: AIBrix Deployment Configurations
global:
  imagePullSecrets: []

controllerManager:
  replicas: 1
  imagePullSecrets: []
  container:
    image:
      repository: aibrix/controller-manager
      tag: v0.8.0
      imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 10m
        memory: 64Mi
    probes:
      liveness:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 15
        periodSeconds: 20
      readiness:
        httpGet:
          path: /readyz
          port: 8081
        initialDelaySeconds: 5
        periodSeconds: 10
  gatewayTimeoutSeconds: 120
  tolerations: []

gatewayPlugin:
  replicaCount: 1
  imagePullSecrets: []
  initContainer:
    image:
      repository: busybox
      tag: stable
  container:
    image:
      repository: aibrix/gateway-plugins
      tag: v0.8.0
      imagePullPolicy: IfNotPresent
    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: "1"
        memory: 1Gi
    probes:
      liveness:
        grpc:
          port: 50052
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readiness:
        grpc:
          port: 50052
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
    envs:
      AIBRIX_POD_METRIC_REFRESH_INTERVAL_MS: "50"
      AIBRIX_PREFIX_CACHE_TOKENIZER_TYPE: "character"
      AIBRIX_PREFIX_CACHE_BLOCK_SIZE: "128"
      AIBRIX_LOAD_BALANCE_IMBALANCE_MIN_GAP: "16"
      AIBRIX_PREFIX_CACHE_STANDARD_DEVIATION_FACTOR: "2"
      AIBRIX_PREFILL_REQUEST_TIMEOUT: "60"
  dependencies:
    redis:
      host: aibrix-redis-master
      port: 6379
  auth:
    bearerToken: ""
  messageTimeout: "60s"
  tolerations: []


gpuOptimizer:
  replicaCount: 1
  imagePullSecrets: []
  container:
    image:
      repository: aibrix/runtime
      tag: v0.8.0
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 10m
        memory: 64Mi
  dependencies:
    redis:
      host: aibrix-redis-master
      port: 6379
  tolerations: []

gateway:
  http:
    enabled: true
  tls:
    enabled: false
    autoGenerate: false
    hostname: ""
    validityDays: 365
    secretName: ""
    port: 443
  envoyProxy:
    replicas: 1
    imagePullSecrets: []
    tolerations: []
    container:
      envoy:
        image: envoyproxy/envoy:v1.33.2
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 1Gi
      shutdownManager:
        image: envoyproxy/gateway:v1.2.8
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
  clientTrafficPolicy:
    connection:
      bufferLimit: 4194304  # 4MiB
  envoyPatchPolicy:
    route:
      timeout: 120s          # e.g., "120s" or "2m"
      connectTimeout: 6s     # e.g., "6s"


metadata:
  service:
    replicas: 1
    imagePullSecrets: []
    initContainer:
      image:
        repository: busybox
        tag: stable
    container:
      image:
        repository: aibrix/metadata-service
        tag: v0.8.0
        imagePullPolicy: IfNotPresent
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
    tolerations: []
    redis:
      host: aibrix-redis-master
      port: 6379
    metricRefreshIntervalMs: "3600000"
  redis:
    replicas: 1
    imagePullSecrets: []
    container:
      image:
        repository: redis
        tag: "7.4"
      resources:
        requests:
          cpu: 100m
          memory: 100Mi

# [CRDs]: Static CRDs are managed by Helm
crd:
  # This value is unused; pass --skip-crds to skip CRD installation.
  enable: true

  # This value is unused; Helm retains static CRDs on uninstall.
  # NOTE: Deleting an AIBrix CRD also deletes its custom resources.
  keep: true


# [WEBHOOKS]: Webhooks configuration
# The following configuration is automatically generated from the manifests
# generated by controller-gen. To update run 'make manifests' and
# the edit command with the '--force' flag
webhook:
  enable: true

# [PROMETHEUS]: To enable a ServiceMonitor to export metrics to Prometheus set true
prometheus:
  enable: false

# Unused in this chart; controller metrics use HTTP.
certmanager:
  enable: false
