{{- $redisHost := default (printf "%s-redis-master" (include "aibrix.fullname" .)) .Values.metadata.service.redis.host }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aibrix.fullname" . }}-metadata-service
  labels:
    {{- include "aibrix.labels" . | nindent 4 }}
    app.kubernetes.io/component: aibrix-metadata-service
spec:
  replicas: {{ .Values.metadata.service.replicas }}
  selector:
    matchLabels:
      {{- include "aibrix.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aibrix-metadata-service
  template:
    metadata:
      annotations:
        checksum/redis-auth: {{ include "aibrix.redis.authenticationChecksum" . }}
      labels:
        {{- include "aibrix.labels" . | nindent 8 }}
        app.kubernetes.io/component: aibrix-metadata-service
    spec:
      {{- include "aibrix.imagePullSecrets" (dict "componentSecrets" .Values.metadata.service.imagePullSecrets "globalSecrets" .Values.global.imagePullSecrets) | nindent 6 }}
      serviceAccountName: {{ include "aibrix.metadata.serviceAccountName" . }}
      initContainers:
        - name: init-redis
          image: {{ .Values.metadata.service.initContainer.image.repository }}:{{ .Values.metadata.service.initContainer.image.tag }}
          imagePullPolicy: {{ .Values.metadata.service.initContainer.image.imagePullPolicy | default "IfNotPresent" }}
          {{- if include "aibrix.redis.connectionHasPassword" (dict "Values" .Values "component" "metadataService") }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aibrix.fullname" . }}-redis
                  key: {{ include "aibrix.redis.connectionPasswordKey" (dict "component" "metadataService") }}
          command:
            - sh
            - -c
            - |
              {{- include "aibrix.redis.authWaitCommand" . | nindent 14 }}
            - redis-wait
            - {{ $redisHost | quote }}
            - {{ .Values.metadata.service.redis.port | quote }}
          {{- else }}
          command: ['sh', '-c', 'until echo "ping" | nc {{ $redisHost }} {{ .Values.metadata.service.redis.port }} -w 1 | grep -c PONG; do echo waiting for redis; sleep 2; done']
          {{- end }}
      containers:
        - name: metadata-service
          image: {{ .Values.metadata.service.container.image.repository }}:{{ .Values.metadata.service.container.image.tag }}
          imagePullPolicy: {{ .Values.metadata.service.container.image.imagePullPolicy | default "IfNotPresent" }}
          command:
            - aibrix_metadata
            - --host
            - "0.0.0.0"
            - --port
            - "8090"
            # Per-job k8s execution: jobs select the k8s-job provider via
            # extra_body.aibrix.planner_decision and their worker pods bring
            # their own inference engine endpoint. --enable-k8s-support lets the
            # metadata service create the k8s clients needed to run jobs as
            # Kubernetes Jobs/Deployments. Requires the jobs RBAC granted in
            # rbac.yaml.
            - --enable-k8s-support
          ports:
            - containerPort: 8090
          resources: {{ toYaml .Values.metadata.service.container.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: REDIS_HOST
              value: {{ $redisHost }}
            - name: REDIS_PORT
              value: "{{ .Values.metadata.service.redis.port }}"
            {{- if include "aibrix.redis.connectionHasPassword" (dict "Values" .Values "component" "metadataService") }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aibrix.fullname" . }}-redis
                  key: {{ include "aibrix.redis.connectionPasswordKey" (dict "component" "metadataService") }}
            {{- end }}
            {{- if include "aibrix.redis.connectionHasPassword" (dict "Values" .Values "component" "metadataService") }}
            - name: WORKER_REDIS_PASSWORD_SECRET_NAME
              value: {{ printf "%s-redis" (include "aibrix.fullname" .) | quote }}
            - name: WORKER_REDIS_PASSWORD_SECRET_KEY
              value: {{ include "aibrix.redis.connectionPasswordKey" (dict "component" "metadataService") | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      {{- with .Values.metadata.service.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.metadata.service.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
