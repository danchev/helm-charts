apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: "{{ .Release.Name }}-pdb"
  namespace: {{ .Release.Namespace }}
spec:
  maxUnavailable: {{ if eq (toString .Values.maxUnavailablePodDisruptionBudget) "" }}1{{ else }}{{ .Values.maxUnavailablePodDisruptionBudget }}{{ end }}
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" . | nindent 6 }}
