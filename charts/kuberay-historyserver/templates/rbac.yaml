{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.rbac.name | default (include "kuberay-historyserver.fullname" .) }}
rules:
  - apiGroups: ["ray.io"]
    resources: ["rayclusters"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.liveClusters.useKubernetesProxy }}
  # Live dashboard requests are read through the Kubernetes service proxy.
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.name | default (include "kuberay-historyserver.fullname" .) }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kuberay-historyserver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.rbac.name | default (include "kuberay-historyserver.fullname" .) }}
{{- end }}
