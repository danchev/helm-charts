{{- if .Values.liveClusters.useKubernetesProxy }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kuberay-historyserver.fullname" . }}-kubeconfig
data:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    current-context: in-cluster
    clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: service-account
    users:
      - name: service-account
        user:
          tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
{{- end }}
