apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kuberay-historyserver.fullname" . }}
  labels:
    app.kubernetes.io/name: ray-historyserver
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kuberay-historyserver.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{ toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "kuberay-historyserver.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kuberay-historyserver.serviceAccountName" . }}
      containers:
        - name: historyserver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- with .Values.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: STORAGE_BACKEND
              value: s3
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3FORCE_PATH_STYLE
              value: {{ .Values.s3.forcePathStyle | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyKey }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "s3.existingSecret is required" .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKeyKey }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          args:
            - --session-cache-max-memory={{ .Values.cache.maxMemory }}
            - --enable-live-clusters={{ .Values.liveClusters.enabled }}
            {{- if .Values.liveClusters.useKubernetesProxy }}
            - --use-kubernetes-proxy=true
            - --kubeconfigs=/etc/ray-historyserver/kubeconfig
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.liveClusters.useKubernetesProxy }}
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/ray-historyserver
              readOnly: true
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
      {{- if .Values.liveClusters.useKubernetesProxy }}
      volumes:
        - name: kubeconfig
          configMap:
            name: {{ include "kuberay-historyserver.fullname" . }}-kubeconfig
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
